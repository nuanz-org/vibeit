services:
  db:
    image: postgres:trixie
    container_name: vibeit-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibeit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibeit}
      POSTGRES_DB: ${POSTGRES_DB:-vibeit}
    volumes:
      # Postgres 18+ (trixie) expects the mount at /var/lib/postgresql, not .../data
      - vibeit_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vibeit} -d ${POSTGRES_DB:-vibeit}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  vibeit_pgdata:
